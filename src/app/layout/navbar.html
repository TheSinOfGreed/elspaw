<header class="navbar">
  <div class="container bar">
    <a routerLink="/" class="brand" aria-label="Elspaw">
      <app-logo />
    </a>

    <button
      type="button"
      class="burger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-nav"
      [attr.aria-label]="'nav.menu' | translate"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
    </button>

    <nav id="main-nav" class="nav" [class.open]="menuOpen()">
      <ul class="links">
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: link.exact }"
              class="link"
            >
              {{ link.label | translate }}
            </a>
          </li>
        }
      </ul>

      <div class="language">
        <button
          type="button"
          class="language__toggle"
          aria-haspopup="listbox"
          [attr.aria-expanded]="languageOpen()"
          [attr.aria-label]="'nav.language' | translate"
          (click)="toggleLanguage()"
        >
          <img [src]="currentLanguage().flag" alt="" class="flag" />
          <span>{{ currentLanguage().label }}</span>
          <app-icon name="chevron-down" class="chevron" [class.open]="languageOpen()" />
        </button>

        @if (languageOpen()) {
          <ul class="language__menu" role="listbox">
            @for (item of language.languages; track item.code) {
              <li role="option" [attr.aria-selected]="item.code === language.current()">
                <button
                  type="button"
                  class="language__option"
                  [class.active]="item.code === language.current()"
                  (click)="selectLanguage(item.code)"
                >
                  <img [src]="item.flag" alt="" class="flag" />
                  <span class="label">{{ item.label }}</span>
                  <span class="name">{{ item.name }}</span>
                </button>
              </li>
            }
          </ul>
        }
      </div>
    </nav>
  </div>
</header>
